<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Página Principal</title>
    <link rel="stylesheet" href="style_paginaprincipal.css">
    <link rel="stylesheet" href="style_menu.css">
    <link rel="shortcut icon" href="imgvid/favicon_steam_gd.ico" type="image/x-icon">
</head>

<body>

    <div class="horizontal">
        <div class="botonesmenu">
            <div class="steam_logo-class"><a target="_new" href="https://store.steampowered.com/"><img src="imgvid/steam_logo.png" class="steam_logo"></a></div>
            <div class="elemento_principal"><a href="index.html" class="enlace_principal">Página Principal</a></div>
            <div class="elemento_secundario"><a href="index_juego.html" class="enlace">Juego</a></div>
            <div class="elemento_secundario"><a href="index_equipo.html" class="enlace">Equipo</a></div>
            <div class="elemento_secundario"><a href="index_logros.html" class="enlace">Logros</a></div>
        </div>

        <div class="cajauser">
            <div class="notifi">
                <div><img class="noti" src="imgvid/noti.png"></div>
            </div>
            <div class="usuario">
                <div><img class="pfp" src="imgvid/pfp.jpeg"></div>
                <div class="nombreusuario"><a target="_new" href="https://steamcommunity.com/id/TheFerry11/"
                        class="enlace">TheFerry11</a></div>
            </div>
        </div>
    </div>



    <div class="cajaPrincipal">

        <div class="contenido">

            <div class="steamlogootravez">
                <img src="imgvid/steam_logo.png" class="STEAM">
            </div>

            <div>
                <a class="textoblanco">Steam es el mejor lugar para jugar, hablar sobre juegos y crearlos.</a>
            </div>

            <div class="lineajugando">
                <div>
                    <div class="puntotexto">
                        <div class="puntoazul"></div>
                        <div class="ladodelpunto">En linea</div>
                    </div>
                    <div class="njugadores">29,405,254</div>
                </div>

                <div>
                    <div class="puntotexto">
                        <div class="puntoverde"></div>
                        <div class="ladodelpunto">Jugando</div>
                    </div>
                    <div class="njugadores">8,562,101</div>
                </div>
            </div>

            <div class="botoninstalar">
                <div class="textoblanco"><a class="instalar" href="https://cdn.akamai.steamstatic.com/client/installer/SteamSetup.exe">Instalar Steam</a>
                </div>
                <div><img src="imgvid/winlogo.png" class="so"></div>
            </div>

            <div class="en">
                <div class="textoblanco">También disponible en:</div>
                <div class="sos">
                    <div><img src="imgvid/winlogo.png" class="so"></div>
                    <div><img src="imgvid/maclogo.webp" class="so"></div>
                    <div><img src="imgvid/linuxlogo.png" class="so"></div>
                </div>
            </div>

        </div>


        <div>
            <img src="imgvid/steamstorehome.jpg" class="steamimg">
        </div>

    </div>

</html>
